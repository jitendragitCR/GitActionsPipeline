apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app-deployment
  labels:
    app: java-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:                  # FIX 1: Changed "the spec:" to just "spec:"
      containers:
      - name: java-app
        image: 327709577232.dkr.ecr.us-east-1.amazonaws.com/my-java-app-repo:latest
        ports:
        - containerPort: 8080
      imagePullSecrets:    # FIX 2: Fixed indentation to line up under spec
      - name: git-ecr-integrate-user
---
apiVersion: v1
kind: Service
metadata:
  name: java-app-service
spec:
  type: NodePort
  selector:
    app: java-app
  ports:
    - protocol: TCP
      port: 80          # Port exposed inside the cluster
      targetPort: 8080  # Tomcat port inside container
