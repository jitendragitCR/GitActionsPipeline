name: Multi-Job Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # Job 1: Test the codebase
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run Unit Tests
      run: mvn test

  # Job 2: Build the WAR file and save it as an artifact
  build:
    runs-on: ubuntu-latest
    needs: test # Only runs if the test job passes
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build WAR Package
      run: mvn clean package -DskipTests

    # Uploading the compiled WAR file so the next job can use it
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: java-war-package
        path: target/*.war
        retention-days: 1 # Kept short for local POC optimization

  # Job 3: Mock Deployment
  deploy:
    runs-on: ubuntu-latest
    needs: build # Only runs if the build job passes
    steps:
    # Downloading the artifact built in the previous job
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: java-war-package
        path: downloaded-target/

    - name: List Downloaded Artifacts (Verification)
      run: ls -R downloaded-target/

    - name: Deploy Application
      run: echo "deployment"
