name: Multi-Job Java CI/CD Pipeline for output

on:
  push:
    branches: [ "main" ]

jobs:
  # Job 1: Test the codebase
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run Unit Tests
      run: mvn test

  # Job 2: Build the WAR file and save it as an artifact
  build:
    runs-on: ubuntu-latest
    needs: test 
    outputs: 
      # FIX 1: Changed '.output.' to '.outputs.'
      war-file: ${{ steps.filename.outputs.war }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build WAR Package
      run: mvn clean package -DskipTests

    - name: Output war file name
      id: filename
      # FIX 2: Replaced the complex find command with a clean, bulletproof bash snippet
      run: |
        WAR_PATH=$(ls target/*.war)
        WAR_NAME=$(basename $WAR_PATH)
        echo "war=$WAR_NAME" >> $GITHUB_OUTPUT

    # Uploading the compiled WAR file so the next job can use it
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: java-war-package
        path: target/*.war
        retention-days: 1 

  # Job 3: Mock Deployment
  deploy:
    runs-on: ubuntu-latest
    needs: build 
    steps:
    # Downloading the artifact built in the previous job
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: java-war-package
        path: downloaded-target/

    - name: Output war file name
      run: echo "The war file name is ${{ needs.build.outputs.war-file }}"

    - name: List Downloaded Artifacts (Verification)
      run: ls -R downloaded-target/

    - name: Deploy Application
      run: echo "deployment"
